[project]
name = "leis-mcp"
version = "0.1.0"
description = "Servidor MCP remoto sobre votos nominais, proposições e inteiro teor do processo legislativo federal brasileiro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=4,<5",
    "numpy>=2",
    "pypdf>=6.19.0",
    "sentence-transformers>=5",
    "torch>=2",
]

[project.scripts]
leis-mcp = "leis_mcp.cli:main"
leis-admin = "leis_mcp.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leis_mcp"]

# Torch só de CPU: o servidor não usa GPU em tempo de consulta, e a roda CUDA
# custa ~2 GB a mais na imagem.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
etl = [
    "pandas>=3.0.5",
    "requests>=2.34.2",
]
