# Produção: Caddy (HTTPS automático) na frente do servidor da Aurora.
#   cp exemplo.env .env && docker compose up -d --build

name: leis

services:
  leis-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: leis-mcp:local
    restart: unless-stopped
    env_file: .env
    environment:
      LEIS_TRANSPORTE: http
      LEIS_DB_IMUTAVEL: "1"
    volumes:
      - ${LEIS_BANCO_DIR:?defina LEIS_BANCO_DIR no .env}:/banco:ro
      - dados:/dados
    expose:
      - "8000"
    # O processo usa até ~3,6 GB; o limite evita que um vazamento derrube a VM.
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      leis-mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEIS_DOMINIO: ${LEIS_DOMINIO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dados:
  caddy_data:
  caddy_config:
