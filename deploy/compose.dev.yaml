# Desenvolvimento: mesma imagem de produção, sem Caddy e sem login, só em 127.0.0.1.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build leis-mcp

services:
  leis-mcp:
    env_file: !reset []
    environment:
      LEIS_AUTH: "off"
      LEIS_PERMITIR_SEM_AUTH_EM_REDE: "1"
      LEIS_DB_IMUTAVEL: "1"
      LEIS_LOG_NIVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    profiles: ["producao"]
